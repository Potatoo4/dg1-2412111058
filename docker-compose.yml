services:
  web:
    build: .
    environment:
      MSSV: "2412111058"
      PORT: "5000"
    volumes:
      - ./app/data:/srv/app/app/data

  nginx:
    image: nginx:alpine
    depends_on:
      - web
    ports:
      - "8081:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
